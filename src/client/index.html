<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zombie base defence</title>
    <style>
      /* Warm stone/brick pixel-art palette, matched to the LPC world tiles
         (see assets/ui-kenney/NOTES.md for the icon/panel sources). Panels
         use a Kenney 9-slice texture via border-image; everything else is
         flat colour, kept deliberately plain per CLAUDE.md's "clarity over
         decoration" and "prefer simple Canvas geometry... " UI rules — only
         the accent colour values below changed from the previous cooler
         grey/military-green scheme; panel art and layout are untouched. */
      :root {
        --bg: #1a1510;
        --panel-dark: #2b2219;
        --text: #ede4d3;
        --text-dim: #a89a85;
        --accent-green: #6f9a57;
        --accent-red: #b5543f;
        --accent-gold: #d4af37;
        --accent-yellow: #f0c929;
        --border-light: #6b5a42;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "Courier New", monospace;
        /* The canvas fills the entire viewport edge-to-edge now (see
           main.ts's resizeCanvas) — no centering/letterboxing needed, and
           overflow:hidden keeps a border-box canvas from ever introducing a
           scrollbar. */
        overflow: hidden;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        /* the canvas draws its own crosshair at the mouse position; the OS
           pointer would just be a redundant second one on top of it */
        cursor: none;
      }

      /* --- Shared 9-slice panel chrome (Kenney "Pixel UI Pack", CC0) --- */
      #hud,
      #team-panel,
      #interact-menu,
      .phase-panel,
      #enemy-intro,
      #character-select {
        border-style: solid;
        border-width: 16px;
        border-image-source: url(/sprites/ui/panels/panel-grey-dark.png);
        border-image-slice: 16 fill;
        border-image-width: 16px;
        border-image-repeat: stretch;
        image-rendering: pixelated;
        color: var(--text);
      }
      .ui-icon {
        display: inline-block;
        vertical-align: -3px;
        image-rendering: pixelated;
      }

      /* #hud and #team-panel stack via flex (not independent fixed offsets)
         so team-panel always sits below the HUD regardless of the HUD's
         content-driven height — avoids the two overlapping at narrow
         viewports or when either panel's content grows. */
      #top-left-stack {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(320px, calc(100vw - 16px));
      }
      #hud {
        font-size: 14px;
        line-height: 2;
        padding: 6px 14px;
        white-space: nowrap;
      }
      #hud .rejected {
        color: var(--accent-red);
        font-weight: 700;
      }

      /* --- Meter bars: track + proportional fill, numbers always shown
         alongside (never the only source of the value). --- */
      .bar {
        display: inline-block;
        width: 64px;
        height: 8px;
        background: #000000a0;
        border: 1px solid #000;
        vertical-align: middle;
        margin: 0 2px;
      }
      .bar-fill {
        display: block;
        height: 100%;
      }
      .bar-hp .bar-fill {
        background: var(--accent-red);
      }
      .bar-wall .bar-fill {
        background: var(--accent-green);
      }
      .bar-revive {
        width: 46px;
        height: 6px;
      }
      .bar-revive .bar-fill {
        background: var(--accent-green);
      }

      /* --- Multiplayer status (up to 4 players) --- */
      #team-panel {
        font-size: 13px;
        padding: 6px 12px;
      }
      .player-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
        white-space: nowrap;
      }
      .player-swatch {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border: 1px solid #0006;
      }
      .player-label {
        min-width: 26px;
        max-width: 110px;
        flex: 0 0 auto;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-downed {
        color: #e0a05c;
      }
      .player-dead {
        color: var(--text-dim);
      }

      #conn {
        position: fixed;
        top: 8px;
        right: 8px;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border: 2px solid var(--border-light);
        color: var(--text);
      }
      #conn.connected {
        background: #2c3a24;
        border-color: var(--accent-green);
      }
      #conn.connecting,
      #conn.disconnected {
        background: #3a2420;
        border-color: var(--accent-red);
      }

      footer {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 12px;
      }
      footer a {
        color: #8ab4ff;
      }

      #controls {
        position: fixed;
        bottom: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 8px 16px;
        border: 2px solid var(--border-light);
        background: var(--panel-dark);
        color: var(--text);
        cursor: pointer;
      }
      #controls button:hover {
        background: #352a1f;
      }
      #controls button:active {
        transform: translateY(1px);
        background: #1d1812;
      }
      #controls button[hidden] {
        display: none;
      }

      /* Centred over the canvas, never blocking the controls or team/HUD
         corners. Empty (the "running" phase) collapses the element entirely. */
      #phase-banner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      #phase-banner:empty {
        display: none;
      }
      .phase-panel {
        padding: 18px 28px;
        text-align: center;
        width: min(320px, calc(100vw - 64px));
        box-sizing: border-box;
      }
      .phase-panel.danger {
        border-image-source: url(/sprites/ui/panels/panel-red-dark.png);
      }
      .phase-panel.success {
        border-image-source: url(/sprites/ui/panels/panel-green-dark.png);
      }
      .phase-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .phase-subtitle {
        margin-top: 8px;
        color: var(--text-dim);
        font-size: 14px;
      }
      .controls-legend {
        margin-top: 16px;
        text-align: left;
        display: inline-block;
        font-size: 12px;
      }
      .controls-legend > div {
        display: flex;
        gap: 10px;
        padding: 2px 0;
      }
      .legend-key {
        color: var(--accent-gold);
        font-weight: 700;
        min-width: 56px;
        display: inline-block;
      }

      /* "New enemy" intro: shown once the first time a zombie type appears
         in a run (main.ts tracks this from dayWaveComposition). Deliberately
         pointer-events: none on the panel itself — the player's aim/shoot
         must keep working underneath it — except the dismiss button, which
         needs to be clickable. Purely informational: nothing here pauses or
         alters the game running behind it. */
      #enemy-intro {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 26px;
        width: min(300px, calc(100vw - 56px));
        box-sizing: border-box;
        text-align: center;
        pointer-events: none;
        z-index: 20;
        animation: intro-glow 1.8s ease-in-out infinite;
      }
      #enemy-intro[hidden] {
        display: none;
      }
      @keyframes intro-glow {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(240, 201, 41, 0);
        }
        50% {
          box-shadow: 0 0 22px rgba(240, 201, 41, 0.45);
        }
      }
      .intro-title {
        color: var(--accent-yellow);
        font-weight: 800;
        letter-spacing: 0.18em;
        font-size: 12px;
      }
      #intro-portrait {
        display: block;
        margin: 8px auto 6px;
        image-rendering: pixelated;
      }
      .intro-name {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .intro-bullets {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        display: inline-block;
        text-align: left;
      }
      .intro-bullets li {
        position: relative;
        padding: 3px 0 3px 18px;
        font-size: 13px;
      }
      .intro-bullets li::before {
        content: "▲";
        position: absolute;
        left: 0;
        top: 5px;
        font-size: 9px;
        color: var(--accent-red);
      }
      #intro-dismiss {
        pointer-events: auto;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 8px 26px;
        border: 2px solid var(--accent-yellow);
        background: var(--panel-dark);
        color: var(--accent-yellow);
        cursor: pointer;
      }
      #intro-dismiss:hover {
        background: #352a1f;
      }

      /* Character select: shown while the LOCAL player's own characterIndex
         is still -1 (never picked, or a brand new identity) — main.ts's
         updateCharacterSelectUi() toggles [hidden] off exactly then,
         regardless of game phase, so a late joiner still gets a chance to
         pick. A taken/selected card state is rebuilt every "state" message
         from state.players, same freshness every other live-state-driven UI
         in this file already has. */
      #character-select {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 26px;
        width: min(560px, calc(100vw - 48px));
        box-sizing: border-box;
        text-align: center;
        z-index: 30;
      }
      #character-select[hidden] {
        display: none;
      }
      .character-select-heading {
        color: var(--accent-yellow);
        font-weight: 800;
        letter-spacing: 0.1em;
        font-size: 14px;
        margin-bottom: 14px;
      }
      #character-grid {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .character-card {
        flex: 1 1 0;
        min-width: 0;
        border: 2px solid var(--border-light);
        background: #16110c;
        padding: 10px 8px;
        cursor: pointer;
      }
      .character-card.selected {
        border-color: var(--accent-gold);
        background: #241c10;
      }
      .character-card.taken {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .character-portrait {
        display: block;
        margin: 0 auto 6px;
        image-rendering: pixelated;
      }
      .character-card-name {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .character-card-flavor {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
        line-height: 1.4;
      }
      .character-card-taken-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--accent-red);
        margin-top: 4px;
      }
      #character-select-form {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
      }
      #character-name-input {
        font: inherit;
        font-size: 13px;
        padding: 8px 10px;
        background: #16110c;
        border: 2px solid var(--border-light);
        color: var(--text);
        width: 180px;
      }
      #character-confirm-btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 8px 16px;
        border: 2px solid var(--border-light);
        background: var(--panel-dark);
        color: var(--text);
        cursor: pointer;
      }
      #character-confirm-btn:hover {
        background: #352a1f;
      }
      #character-confirm-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* X-menu: near the base or a turret, [1]/[2]/.../X/Esc are the only
         inputs — kept keyboard-only (no click targets) like the previous
         plain-text version, just restyled with panel chrome + icons. */
      #interact-menu {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 20px;
        font-size: 14px;
        width: min(320px, calc(100vw - 64px));
        box-sizing: border-box;
        pointer-events: none;
      }
      #interact-menu[hidden] {
        display: none;
      }
      .menu-heading {
        font-weight: 800;
        letter-spacing: 0.08em;
        text-align: center;
        margin-bottom: 8px;
      }
      .menu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 2px;
      }
      .menu-row-disabled {
        opacity: 0.5;
      }
      .menu-key {
        color: var(--accent-gold);
        font-weight: 700;
        width: 22px;
        flex: 0 0 auto;
      }
      .menu-label {
        flex: 1;
      }
      .menu-cost {
        display: flex;
        align-items: center;
        gap: 3px;
        color: var(--accent-gold);
        font-size: 13px;
        white-space: nowrap;
      }
      .menu-cost-insufficient {
        color: var(--accent-red);
      }
      .menu-hint {
        text-align: center;
        margin-top: 8px;
        color: var(--text-dim);
        font-size: 12px;
      }

      /* Contextual "[X] Base Menu" / "[Hold E] Revive" / "[H] Use Medkit" —
         surfaces existing keybinds/interactions when in range, nothing new. */
      #prompt {
        position: fixed;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        pointer-events: none;
      }
      #prompt[hidden] {
        display: none;
      }
      .prompt-hint {
        background: #16110c;
        border: 2px solid var(--border-light);
        color: var(--text);
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="top-left-stack">
      <div id="hud"></div>
      <div id="team-panel"></div>
    </div>
    <div id="conn" class="connecting">connecting…</div>
    <div id="phase-banner"></div>
    <div id="interact-menu" hidden></div>
    <div id="prompt" hidden></div>
    <div id="enemy-intro" hidden>
      <div class="intro-title">NEW ENEMY</div>
      <canvas id="intro-portrait" width="110" height="110"></canvas>
      <div class="intro-name" id="intro-name"></div>
      <ul class="intro-bullets" id="intro-bullets"></ul>
      <button id="intro-dismiss">Got it</button>
    </div>
    <div id="character-select" hidden>
      <div class="character-select-heading">CHOOSE YOUR SURVIVOR</div>
      <div id="character-grid">
        <div class="character-card" data-index="0">
          <canvas class="character-portrait" width="64" height="64"></canvas>
          <div class="character-card-name">Soldier</div>
          <div class="character-card-flavor">Grey armour. Holds the line.</div>
          <div class="character-card-taken-label" hidden>TAKEN</div>
        </div>
        <div class="character-card" data-index="1">
          <canvas class="character-portrait" width="64" height="64"></canvas>
          <div class="character-card-name">Soldier</div>
          <div class="character-card-flavor">Gold armour. First through the door.</div>
          <div class="character-card-taken-label" hidden>TAKEN</div>
        </div>
        <div class="character-card" data-index="2">
          <canvas class="character-portrait" width="64" height="64"></canvas>
          <div class="character-card-name">Sara</div>
          <div class="character-card-flavor">Teal. Quick on her feet.</div>
          <div class="character-card-taken-label" hidden>TAKEN</div>
        </div>
        <div class="character-card" data-index="3">
          <canvas class="character-portrait" width="64" height="64"></canvas>
          <div class="character-card-name">Princess</div>
          <div class="character-card-flavor">Blue. Doesn't wait to be rescued.</div>
          <div class="character-card-taken-label" hidden>TAKEN</div>
        </div>
      </div>
      <div id="character-select-form">
        <input id="character-name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />
        <button id="character-confirm-btn" disabled>Confirm</button>
      </div>
    </div>
    <div id="controls">
      <button id="btn-start">Start Game</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-resume">Resume</button>
      <button id="btn-retry">Retry Current Day</button>
      <button id="btn-restart">Restart (Day 1)</button>
    </div>
    <footer><a href="/readme/">About this app</a></footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
