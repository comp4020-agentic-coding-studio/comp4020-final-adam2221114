<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zombie base defence</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        display: block;
        border: 1px solid #333;
        /* the canvas draws its own crosshair at the mouse position; the OS
           pointer would just be a redundant second one on top of it */
        cursor: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        font-size: 14px;
        line-height: 1.6;
        background: rgb(0 0 0 / 55%);
        padding: 8px 12px;
        border-radius: 4px;
      }
      #conn {
        position: fixed;
        top: 8px;
        right: 8px;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 4px;
      }
      #conn.connected {
        background: #1f5c1f;
      }
      #conn.connecting,
      #conn.disconnected {
        background: #5c1f1f;
      }
      footer {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 12px;
      }
      footer a {
        color: #8ab4ff;
      }
      #controls {
        position: fixed;
        bottom: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        font: inherit;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 4px;
        border: 1px solid #555;
        background: #2a2a2a;
        color: #eee;
        cursor: pointer;
      }
      #controls button:hover {
        background: #3a3a3a;
      }
      #controls button[hidden] {
        display: none;
      }
      /* Centred over the canvas, never blocking the controls or HUD corners.
         Empty text (the "running" phase) collapses the element entirely. */
      #phase-banner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 8px rgb(0 0 0 / 70%);
        pointer-events: none;
      }
      #phase-banner:empty {
        display: none;
      }
      /* X-menu: plain monospace text block, no buttons — purely a keyboard
         menu ([1]/[2]/X/Esc), so pointer-events stay off like the banner. */
      #interact-menu {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgb(10 10 10 / 88%);
        border: 1px solid #555;
        border-radius: 6px;
        padding: 16px 24px;
        font-family: ui-monospace, monospace;
        font-size: 15px;
        line-height: 1.7;
        white-space: pre;
        pointer-events: none;
      }
      #interact-menu[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="conn" class="connecting">connecting…</div>
    <div id="phase-banner"></div>
    <div id="interact-menu" hidden></div>
    <div id="controls">
      <button id="btn-start">Start Game</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-resume">Resume</button>
      <button id="btn-restart">Restart</button>
    </div>
    <footer><a href="/readme/">About this app</a></footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
